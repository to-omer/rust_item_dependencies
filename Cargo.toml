[package]
name = "rust-item-dependencies"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"
# This crate links rustc_private metadata from a custom stage2. Cargo invokes
# rustdoc separately, so doctests cannot share that compiler ABI.
doctest = false

[dependencies]
tempfile = "3.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
