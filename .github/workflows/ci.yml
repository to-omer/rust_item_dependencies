name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 60
          - os: macos-latest
            timeout: 60
          - os: windows-latest
            timeout: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: >-
          rustup toolchain install nightly-2026-08-10
          --profile minimal
          --component clippy
          --component rustc-dev
          --component rust-src
          --component rustfmt
      - name: Build
        run: cargo build --locked --all-targets
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check tools/rid.rs
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run cargo rid tests
        env:
          CARGO_TARGET_DIR: target/rid-tool-tests
        run: cargo -Zscript test --manifest-path tools/rid.rs
      - name: Identify runner image
        id: runner-image
        shell: bash
        run: printf 'name=%s\n' "${ImageOS:?}" >> "$GITHUB_OUTPUT"
      - name: Restore patched compiler
        id: patched-compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rid/rustc/build
          # Bump the version when compiler build inputs or the cached layout become incompatible.
          key: rid-rustc-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.name }}-${{ hashFiles('rustc-patches/queue-digest') }}-${{ hashFiles('rustc-patches/patched-revision') }}
      - name: Bootstrap patched compiler through cargo rid
        run: >-
          cargo rid tests/fixtures/compiler/driver_smoke.rs
          -o target/ci-reduced.rs
      - name: Run full acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -Vv | sed -n 's/^host: //p' | tr -d '\r')
          test -n "$host"
          stage2="$PWD/target/rid/rustc/build/$host/stage2"
          bash scripts/check-acceptance.sh "$stage2"
      - name: Remove materialized Windows outputs before caching
        if: runner.os == 'Windows' && steps.patched-compiler-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $links = @(Get-ChildItem -LiteralPath target/rid/rustc/build -Recurse -Force -Attributes Directory+ReparsePoint)
          foreach ($link in $links) {
            Write-Host "Removing generated directory link: $($link.FullName) ($($link.LinkType))"
            [System.IO.Directory]::Delete($link.FullName, $false)
          }
          $remaining = @(Get-ChildItem -LiteralPath target/rid/rustc/build -Recurse -Force -Attributes Directory+ReparsePoint)
          if ($remaining.Count -ne 0) {
            throw "Generated directory links remain in the patched compiler build"
          }
          $hostTriple = rustc -Vv |
            Select-String -Pattern '^host: ' |
            ForEach-Object { $_.Line.Substring(6).Trim() }
          if ([string]::IsNullOrWhiteSpace($hostTriple)) {
            throw 'rustc did not report its host'
          }
          $buildRoot = (Resolve-Path -LiteralPath target/rid/rustc/build).Path
          foreach ($stage in @('stage1', 'stage2')) {
            $sysroot = Join-Path $buildRoot "$hostTriple/$stage"
            if (-not [System.IO.Directory]::Exists($sysroot)) {
              throw "Materialized sysroot is missing: $sysroot"
            }
            [System.IO.Directory]::Delete($sysroot, $true)
          }
      - name: Save patched compiler
        if: github.ref == 'refs/heads/main' && steps.patched-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rid/rustc/build
          key: ${{ steps.patched-compiler-cache.outputs.cache-primary-key }}
