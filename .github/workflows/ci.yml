name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 60
          - os: macos-latest
            timeout: 60
          - os: windows-latest
            timeout: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: >-
          rustup toolchain install nightly-2026-08-10
          --profile minimal
          --component clippy
          --component rustc-dev
          --component rust-src
          --component rustfmt
      - name: Build
        shell: bash
        run: |
          cargo build --locked --all-targets
          cargo build --locked --manifest-path tools/Cargo.toml --target-dir target/rid-tool-tests --all-targets
      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/Cargo.toml --all -- --check
      - name: Run Clippy
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/Cargo.toml --target-dir target/rid-tool-tests --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run cargo rid tests
        env:
          CARGO_TARGET_DIR: target/rid-tool-tests
        run: cargo test --locked --manifest-path tools/Cargo.toml
      - name: Identify runner image
        id: runner-image
        shell: bash
        run: printf 'name=%s\n' "${ImageOS:?}" >> "$GITHUB_OUTPUT"
      - name: Restore patched compiler
        id: patched-compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rid/rustc/build
          # Bump the version when compiler build inputs or the cached layout become incompatible.
          key: rid-rustc-v5-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.name }}-${{ hashFiles('rustc-patches/queue-digest') }}-${{ hashFiles('rustc-patches/patched-revision') }}
      - name: Prepare patched compiler and verify cache reuse
        env:
          RUST_ITEM_DEPENDENCIES_TEST_COMPILER_CACHE_HIT: ${{ steps.patched-compiler-cache.outputs.cache-hit == 'true' }}
        run: >-
          cargo test --locked --manifest-path tools/Cargo.toml --target-dir target/rid-tool-tests
          --bin cargo-rid -- --ignored --nocapture
      - name: Run full acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -Vv | sed -n 's/^host: //p' | tr -d '\r')
          test -n "$host"
          stage2="$PWD/target/rid/rustc/build/$host/stage2"
          bash scripts/check-acceptance.sh "$stage2"
      - name: Remove materialized Windows outputs before caching
        if: runner.os == 'Windows' && steps.patched-compiler-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $links = @(Get-ChildItem -LiteralPath target/rid/rustc/build -Recurse -Force -Attributes Directory+ReparsePoint)
          foreach ($link in $links) {
            Write-Host "Removing generated directory link: $($link.FullName) ($($link.LinkType))"
            [System.IO.Directory]::Delete($link.FullName, $false)
          }
          $remaining = @(Get-ChildItem -LiteralPath target/rid/rustc/build -Recurse -Force -Attributes Directory+ReparsePoint)
          if ($remaining.Count -ne 0) {
            throw "Generated directory links remain in the patched compiler build"
          }
          $hostTriple = rustc -Vv |
            Select-String -Pattern '^host: ' |
            ForEach-Object { $_.Line.Substring(6).Trim() }
          if ([string]::IsNullOrWhiteSpace($hostTriple)) {
            throw 'rustc did not report its host'
          }
          $buildRoot = (Resolve-Path -LiteralPath target/rid/rustc/build).Path
          foreach ($stage in @('stage1', 'stage2')) {
            $sysroot = Join-Path $buildRoot "$hostTriple/$stage"
            if (-not [System.IO.Directory]::Exists($sysroot)) {
              throw "Materialized sysroot is missing: $sysroot"
            }
            [System.IO.Directory]::Delete($sysroot, $true)
          }
      - name: Save patched compiler
        if: github.ref == 'refs/heads/main' && steps.patched-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rid/rustc/build
          key: ${{ steps.patched-compiler-cache.outputs.cache-primary-key }}

  container:
    name: Container (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up WSL
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: false
          wsl-shell-user: root
          additional-packages: ca-certificates curl build-essential git systemd-sysv
          wsl-conf: |
            [boot]
            systemd=true
      - name: Install Linux Docker Engine
        if: runner.os == 'Windows'
        shell: wsl-bash_Ubuntu-24.04 {0}
        run: bash scripts/install-wsl-docker.sh
      - name: Start Linux Docker Engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/start-wsl-docker.ps1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: rid-image:${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install Rust
        run: rustup toolchain install nightly-2026-08-10 --profile minimal
      - name: Test distribution image
        env:
          RUST_ITEM_DEPENDENCIES_TEST_IMAGE: rid-image:${{ matrix.arch }}
        run: >-
          cargo +nightly-2026-08-10 test --locked --manifest-path tools/Cargo.toml
          --target-dir target/rid-tool-tests --test container
          -- --ignored --nocapture --test-threads=1
      - name: Test distribution image from Linux on WSL
        if: runner.os == 'Windows'
        shell: wsl-bash_Ubuntu-24.04 {0}
        run: |
          source_dir=$(mktemp -d /root/rid-container-tests.XXXXXX)
          git archive HEAD | tar --extract --directory "$source_dir"
          cd "$source_dir"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://sh.rustup.rs --output /tmp/rid-rustup-init.sh
          sh /tmp/rid-rustup-init.sh -y --no-modify-path --profile minimal \
            --default-toolchain nightly-2026-08-10
          export PATH="$HOME/.cargo/bin:$PATH"
          export DOCKER_HOST=unix:///var/run/docker.sock
          export RUST_ITEM_DEPENDENCIES_TEST_IMAGE=rid-image:amd64
          cargo +nightly-2026-08-10 test --locked --manifest-path tools/Cargo.toml \
            --target-dir target/rid-tool-tests --test container \
            -- --ignored --nocapture --test-threads=1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Store tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          candidate="$IMAGE:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag "rid-image:$ARCH" "$candidate"
          docker push "$candidate"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')
          mkdir -p target/container-digests
          printf '%s@%s' "$IMAGE" "$digest" > "target/container-digests/$ARCH"
      - name: Upload tested image reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.arch }}
          path: target/container-digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Show WSL Docker Engine logs
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP/rid-wsl-docker.*.log" | Get-Content

  publish-container:
    name: Publish container
    needs: [full, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: target/container-digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Refusing to publish an outdated main commit' >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:main" \
            --file target/container-digests/amd64 \
            --file target/container-digests/arm64
