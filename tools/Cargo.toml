[package]
name = "cargo-rid"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "cargo-rid"
path = "rid.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
walkdir = "2.5"

[workspace]
